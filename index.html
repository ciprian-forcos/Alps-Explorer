    body {

      letter-spacing: 0.08em;

      flex-shrink: 0;
      flex-wrap: wrap;
      z-index: 999;

    .controls-label {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--mist);
    }

      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      background: white;
    }
    .toggle-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    .toggle-btn.inactive { background: #f0ece6; color: var(--mist); border-color: #ddd6c8; }

    .country-btn {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid #d1c9bc;
      background: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      color: var(--slate);

    .country-btn.active { background: var(--ink); color: white; border-color: var(--ink); }
    .map-style-group { margin-left: auto; display: flex; gap: 6px; }
    .style-btn {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid #d1c9bc;
      background: white;
      font-family: 'DM Sans', sans-serif;

      font-weight: 500;

      color: var(--slate);

    .leaflet-popup-content-wrapper {

      padding: 0;
      overflow: hidden;
      border: none;

      padding: 14px 16px;

const tiles = {
  street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }),
  terrain: L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenTopoMap contributors',
    maxZoom: 17
  }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri World Imagery',
    maxZoom: 19
  })
};

const map = L.map('map', {
  center: [45.2, 6.8],
  zoom: 8,
  layers: [tiles.street],
  zoomControl: true
});

let currentTile = 'street';

function resortIcon(country) {
  return L.divIcon({
    className: '',
    html: '<div style="width:28px;height:28px;border-radius:50%;background:#2563eb;border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;">\u26f7\ufe0f<\/div>',
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -16]
  });
}

function villageIcon() {
  return L.divIcon({
    className: '',
    html: '<div style="width:26px;height:26px;border-radius:50%;background:#16a34a;border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;">\ud83c\udfe1<\/div>',
    iconSize: [26, 26],
    iconAnchor: [13, 13],
    popupAnchor: [0, -15]
  });
}

function starsHTML(n) {
  return '\u2605'.repeat(n) + '\u2606'.repeat(5 - n);
}

function buildResortPopup(r) {
  const linksHTML = r.links.map(l =>
    '<a href="' + l.url + '" target="_blank" class="popup-link"><span class="link-icon">\ud83d\udd17<\/span> ' + l.label + '<\/a>'
  ).join('');
  const pisteStat = r.pistes > 0
    ? '<div class="stat"><span class="stat-val">' + r.pistes + ' km<\/span><span class="stat-label">Pistes<\/span><\/div>'
    : '<div class="stat"><span class="stat-val">Off-piste<\/span><span class="stat-label">Only<\/span><\/div>';
  const flag = r.country === 'France' ? '\ud83c\uddeb\ud83c\uddf7' : '\ud83c\uddee\ud83c\uddf9';
  return '<div class="popup-header"><div class="popup-type resort">\u26f7\ufe0f Ski Resort<\/div><div class="popup-name">' + r.name + '<\/div><div class="popup-country">' + flag + ' ' + r.country + '<\/div><\/div><div class="popup-body"><div class="popup-stats">' + pisteStat + '<div class="stat"><span class="stat-val">' + r.altMax + 'm<\/span><span class="stat-label">Max alt.<\/span><\/div><div class="stat"><span class="stat-val">' + (r.altMax - r.altMin) + 'm<\/span><span class="stat-label">Vertical<\/span><\/div><\/div><div class="popup-desc">' + r.desc + '<\/div><div class="popup-links">' + linksHTML + '<\/div><\/div>';
}

function buildVillagePopup(v) {
  const linksHTML = v.propertyLinks.map(l =>
    '<a href="' + l.url + '" target="_blank" class="popup-link property"><span class="link-icon">\ud83c\udfe0<\/span> ' + l.label + '<\/a>'
  ).join('');
  const flag = v.country === 'France' ? '\ud83c\uddeb\ud83c\uddf7' : '\ud83c\uddee\ud83c\uddf9';
  return '<div class="popup-header"><div class="popup-type village">\ud83c\udfe1 Investment Village<\/div><div class="popup-name">' + v.name + '<\/div><div class="popup-country">' + flag + ' ' + v.country + '<\/div><\/div><div class="popup-body"><div class="popup-stats"><div class="stat"><span class="stat-val">' + v.altitude + 'm<\/span><span class="stat-label">Altitude<\/span><\/div><div class="stat"><span class="stat-val rating-stars">' + starsHTML(v.buyRating) + '<\/span><span class="stat-label">Buy rating<\/span><\/div><div class="stat"><span class="stat-val" style="font-size:0.75rem;">' + v.nearResort + '<\/span><span class="stat-label">Near resort<\/span><\/div><\/div><div class="popup-desc">' + v.desc + '<\/div><div style="font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--pine);margin-bottom:6px;">\ud83c\udfe0 Property listings<\/div><div class="popup-links">' + linksHTML + '<\/div><\/div>';
}

const resortMarkers = [];
const villageMarkers = [];
let showResorts = true;
let showVillages = true;
let currentCountry = 'all';

const resortLayer = L.layerGroup().addTo(map);
const villageLayer = L.layerGroup().addTo(map);

RESORTS.forEach(function(r) {
  const m = L.marker([r.lat, r.lng], { icon: resortIcon(r.country) })
    .bindPopup(buildResortPopup(r), { maxWidth: 320 });
  m._data = r;
  resortMarkers.push(m);
  resortLayer.addLayer(m);
});

VILLAGES.forEach(function(v) {
  const m = L.marker([v.lat, v.lng], { icon: villageIcon() })
    .bindPopup(buildVillagePopup(v), { maxWidth: 320 });
  m._data = v;
  villageMarkers.push(m);
  villageLayer.addLayer(m);
});

function updateMarkers() {
  resortLayer.clearLayers();
  villageLayer.clearLayers();
  let count = 0;
  if (showResorts) {
    resortMarkers.forEach(function(m) {
      if (currentCountry === 'all' || m._data.country === currentCountry) {
        resortLayer.addLayer(m);
        count++;
      }
    });
  }
  if (showVillages) {
    villageMarkers.forEach(function(m) {
      if (currentCountry === 'all' || m._data.country === currentCountry) {
        villageLayer.addLayer(m);
        count++;
      }
    });
  }
  document.getElementById('visibleCount').textContent = count;
}

function toggleLayer(type, btn) {
  if (type === 'resorts') showResorts = !showResorts;
  if (type === 'villages') showVillages = !showVillages;
  btn.classList.toggle('active');
  btn.classList.toggle('inactive');
  updateMarkers();
}

function filterCountry(country, btn) {
  currentCountry = country;
  document.querySelectorAll('.country-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  updateMarkers();
}

function switchTile(style, btn) {
  map.removeLayer(tiles[currentTile]);
  map.addLayer(tiles[style]);
  currentTile = style;
  document.querySelectorAll('.style-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}

updateMarkers();
</script>
